{% extends "base.html" %}

{% block page_header %}
<div class="page-header" data-aos="fade-down">
    <a href="#" class="page-back-button" onclick="window.history.back(); return false;" title="Go Back">
        <i class="fas fa-arrow-left"></i>
    </a>
    <div class="page-title-wrap">
        <h1 class="page-title">Admin Access Control</h1>
        <p class="page-description">Secure administrator portal for SmartCam+ System</p>
    </div>
</div>
{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center animate-fade-in-up" style="min-height: 60vh;">
    <div class="col-md-6 col-lg-5">
        <div class="glass-form p-4">
            <div class="login-icon-wrap mb-4" data-aos="zoom-in" style="background: transparent;">
                <img src="/static/img/logo.svg" alt="SmartCam+" class="brand-logo-img" style="height: 64px; width: 64px; filter: drop-shadow(0 2px 8px rgba(139,92,246,0.3));">
                <script>
                    (function() {
                        var theme = localStorage.getItem('theme') || localStorage.getItem('dashboard-theme') || 'light';
                        var img = document.querySelector('.login-icon-wrap .brand-logo-img');
                        if (img) {
                            img.src = theme === 'dark' ? "/static/img/logo-dark.svg" : "/static/img/logo.svg";
                        }
                    })();
                </script>
            </div>
            
            <h2 class="text-center mb-4"><span class="gradient-text" style="font-weight: 800;">Admin Login</span></h2>
            
            <form method="POST" id="loginForm" class="mb-3">
                <div class="mb-4 position-relative">
                    <label for="password" class="form-label">System Security Password</label>
                    <div class="input-group">
                        <span class="input-group-text bg-transparent border-0 position-absolute" style="left: 0.75rem; top: 50%; transform: translateY(-50%); z-index: 10; padding: 0;">
                            <i class="fas fa-lock text-muted"></i>
                        </span>
                        <input type="password" name="password" id="password" class="premium-input form-control" style="padding-left: 2.5rem; padding-right: 3rem; height: 46px;" placeholder="Enter admin password" required {% if lockout_remaining > 0 %}disabled{% endif %}>
                        <button class="glass-button ms-2" type="button" id="togglePassword" style="border-radius: var(--radius-sm); height: 46px; width: 46px; padding: 0;" aria-label="Show password">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="gradient-button w-100" style="height: 48px;" {% if lockout_remaining > 0 %}disabled{% endif %}>
                    <i class="fas fa-sign-in-alt me-2"></i> Unlock System
                </button>
            </form>

            <div class="d-flex flex-column align-items-center gap-2 mt-4">
                <a href="/reset_password" class="glass-button w-100" style="font-size: 0.85rem; height: 42px;">
                    <i class="fas fa-key me-2 text-primary"></i> Forgot Password?
                </a>
                <a href="/" class="btn btn-secondary w-100" style="font-size: 0.85rem; height: 42px;">
                    <i class="fas fa-home me-2"></i> Return to Home
                </a>
            </div>
        </div>
    </div>
</div>

<style>
    .login-icon-wrap {
        width: 72px;
        height: 72px;
        border-radius: 50%;
        background: var(--brand-gradient-subtle);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto;
        font-size: 1.875rem;
        box-shadow: 0 4px 12px rgba(139,92,246,0.15);
    }
</style>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const passwordInput = document.getElementById('password');
        const togglePassword = document.getElementById('togglePassword');
        const eyeIcon = togglePassword ? togglePassword.querySelector('i') : null;

        if (passwordInput && togglePassword && eyeIcon) {
            togglePassword.addEventListener('click', function() {
                const isShown = passwordInput.type === 'text';
                passwordInput.type = isShown ? 'password' : 'text';
                eyeIcon.classList.toggle('fa-eye', isShown);
                eyeIcon.classList.toggle('fa-eye-slash', !isShown);
                togglePassword.setAttribute('aria-label', isShown ? 'Show password' : 'Hide password');
            });
        }

        // Lockout countdown handler
        {% if lockout_remaining > 0 %}
        let lockoutSeconds = {{ lockout_remaining }};
        const submitButton = document.querySelector('button[type="submit"]');
        
        if (passwordInput) passwordInput.disabled = true;
        if (submitButton) submitButton.disabled = true;
        
        function updateLockoutNotification() {
            if (lockoutSeconds > 0) {
                showNotification('Too many failed attempts. Please wait ' + lockoutSeconds + ' seconds before trying again.', 'error');
            }
        }
        
        updateLockoutNotification();
        
        const lockoutInterval = setInterval(() => {
            lockoutSeconds--;
            if (lockoutSeconds > 0) {
                updateLockoutNotification();
            } else {
                clearInterval(lockoutInterval);
                if (passwordInput) passwordInput.disabled = false;
                if (submitButton) submitButton.disabled = false;
                showNotification('Lockout expired. You can try logging in again.', 'success');
                setTimeout(() => window.location.reload(), 1500);
            }
        }, 1000);
        {% endif %}
        
        {% if error and lockout_remaining == 0 %}
        showNotification('{{ error }}', 'error');
        {% endif %}
    });
</script>
{% endblock %}
